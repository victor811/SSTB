<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #121212;
        color: #ffffff;
        font-family: sans-serif;
      }
      #shell-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #333;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="shell-loader">
        <div class="spinner"></div>
      </div>
    </div>

    <script>
      const BACKEND_URL =
        "https://script.google.com/macros/s/AKfycbx8oIQAjHgwnjYa6pQohLFM8AXGmk5Uvjlhbn5HvFxqri5rCwBwIqs6SPvVEzkBgmbu/exec";

      function showVisualError(msg) {
        const badge = document.getElementById("status-badge");
        if (badge) {
          badge.style.background = "#ef4444";
          badge.innerText = "🔴 " + msg;
        } else {
          document.getElementById("app").innerHTML =
            `<div style="padding:20px; color:#ef4444; text-align:center; font-family:sans-serif;">${msg}</div>`;
        }
      }

      (function bootstrap() {
        if (window.Telegram && window.Telegram.WebApp) {
          Telegram.WebApp.ready();
          Telegram.WebApp.expand();
        }

        const initData = window.Telegram?.WebApp?.initData || "";
        const cbName = "jsonp_cb_" + Date.now();

        window[cbName] = function (payload) {
          delete window[cbName];
          const scriptEl = document.getElementById(cbName);
          if (scriptEl) scriptEl.remove();

          if (payload && payload.success) {
            window.globalData = payload.data;

            // 1. Стили
            if (payload.css) {
              const style = document.createElement("style");
              style.textContent = payload.css;
              document.head.appendChild(style);
            }

            // 2. Разметка
            if (payload.html) {
              document.getElementById("app").innerHTML = payload.html;
            }

            // 3. Безопасное исполнение JS из AppJs
            if (payload.js) {
              try {
                const cleanJs = payload.js.replace(/<\/?script[^>]*>/gi, "").trim();
                const executeBundle = new Function(cleanJs);
                executeBundle();
              } catch (jsErr) {
                showVisualError("Синтаксис AppJs: " + jsErr.message);
                console.error("Ошибка в AppJs:", jsErr);
                return;
              }
            }

            // 4. Вызов инициализации интерфейса
            try {
              if (typeof window.initAppUI === "function") {
                window.initAppUI();
              } else {
                showVisualError("initAppUI не объявлен в window");
              }
            } catch (err) {
              showVisualError("Ошибка initAppUI: " + err.message);
            }
          } else {
            showVisualError(payload?.error || "Ошибка загрузки данных бэкенда");
          }
        }; // <-- Вот здесь была пропущена закрывающая скобка и точка с запятой!

        const script = document.createElement("script");
        script.id = cbName;
        script.src = `${BACKEND_URL}?action=getAppBundle&callback=${cbName}&initData=${encodeURIComponent(initData)}`;
        script.onerror = function () {
          showVisualError("Ошибка сети (Network Error)");
        };
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
